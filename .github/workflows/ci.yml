name: CI

# Repository checks plus the Rust host build. The "Protect main" ruleset
# requires a status check named "check", so keep this job name.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No device databases committed
        run: |
          if git ls-files | grep -E '\.(sqlite|db)(-wal|-shm|-journal)?$'; then
            echo "::error::Device database committed. Test fixtures must be trimmed and anonymized first."
            exit 1
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Local Markdown links resolve
        run: python .github/scripts/check_md_links.py
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
