[package]
name = "nickelinksync"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
description = "Sync the reading progress of sideloaded ebooks between Kobo, Tolino and KOReader through a KOSync server"
license = "MIT"
repository = "https://github.com/dkuester/NickelInkSync"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
md-5 = "0.11.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# Small binary for the device: size over speed, one codegen unit for LTO,
# no symbols or debug info.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
